name: Add apple touch icon
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/add-apple-icon.yml"
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [main, gh-pages]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: Download icon
        run: curl -fsSL -o apple-touch-icon.png https://api.goldengloves59.ru/apple-touch-icon.png
      - name: Commit icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Add apple-touch-icon.png"
          git push
